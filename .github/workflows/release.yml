name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'papra-hq/papra'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: 'pnpm'

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm i

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.CHANGESET_GITHUB_TOKEN }}
          # Note: pnpm install after versioning is necessary to refresh lockfile
          version-script: pnpm run version
          publish-script: pnpm exec changeset publish
          commit-message: 'chore(release): update versions'
          pr-title: 'chore(release): update versions'

      - name: Trigger Docker build
        if: steps.changesets.outputs.published == 'true' && contains(fromJson(steps.changesets.outputs['published-packages']).*.name, '@papra/app')
        run: |
          VERSION=$(echo '${{ steps.changesets.outputs['published-packages'] }}' | jq -r '.[] | select(.name=="@papra/app") | .version')
          echo "VERSION: $VERSION"
          gh workflow run release-docker.yaml -f version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Android build
        if: steps.changesets.outputs.published == 'true' && contains(fromJson(steps.changesets.outputs['published-packages']).*.name, '@papra/mobile')
        run: |
          VERSION=$(echo '${{ steps.changesets.outputs['published-packages'] }}' | jq -r '.[] | select(.name=="@papra/mobile") | .version')
          echo "VERSION: $VERSION"
          gh workflow run release-mobile.yaml --ref main -f version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
